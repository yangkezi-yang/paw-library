services:
  - type: web
    name: baiwujinji-community
    runtime: node
    repo: https://github.com/yangkezi-yang/paw-library
    branch: baiwujinji-render
    rootDir: forum-render
    region: singapore
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: 'off'
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    disk:
      name: community-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DB_PATH
        value: /var/data/forum.sqlite

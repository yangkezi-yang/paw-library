services:
  - type: web
    name: paw-library-mobile
    runtime: node
    plan: free
    rootDir: standalone
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: UPSTREAM_SITE_URL
        value: https://mint-paw-studio-1109.workspace-682598.chatgpt.site
      - key: UPSTREAM_SITE_TOKEN
        sync: false

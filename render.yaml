services:
  - type: web
    name: baiwujinji-community-free
    runtime: node
    repo: https://github.com/yangkezi-yang/paw-library
    branch: baiwujinji-render
    rootDir: forum-render
    region: singapore
    plan: free
    autoDeployTrigger: 'off'
    buildCommand: npm ci --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: DATABASE_URL
        fromDatabase:
          name: baiwujinji-community-free-db
          property: connectionString

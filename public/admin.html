<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#dff3ef"><title>资源管理 · Paw Library</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="/styles.css"></head>
<body class="admin-body"><div class="ambient ambient-one"></div><div class="ambient ambient-two"></div><header class="topbar wrap"><a class="brand" href="/"><span class="brand-paw">🐾</span><span><b>Paw Library</b><small>YOUR LITTLE RESOURCE CORNER</small></span></a><nav><a class="nav-link" href="/">返回前台 ↗</a></nav></header>
<main class="wrap admin-main"><div class="admin-title"><div class="eyebrow">THE LITTLE CONTROL ROOM <span>✦</span></div><h1>资源管理后台 <span>🐾</span></h1><p>把新的视频和文档放进资源小屋吧。</p></div>
<div class="admin-tabs"><button class="tab-button selected" data-tab="video">🎬 上传视频</button><button class="tab-button" data-tab="document">📚 上传文档</button><button class="tab-button" data-tab="manage">☁️ 资源管理</button></div>
<section class="admin-panel" id="panel-video"><div class="panel-heading"><div><h2>添加一支新视频</h2><p>支持 MP4、MOV、WEBM、MKV，单个文件最大 1GB。</p></div><span class="panel-sticker">🎞️</span></div><form class="upload-form" id="videoForm" enctype="multipart/form-data"><label class="drop-zone" for="videoFile"><input id="videoFile" name="file" type="file" accept="video/mp4,video/webm,video/quicktime,video/x-matroska,.mp4,.mov,.webm,.mkv" required><span class="upload-symbol">↑</span><b>点击选择视频，或拖拽到这里</b><small id="videoFileName">支持 MP4 / MOV / WEBM / MKV</small></label><div class="form-fields"><label>视频标题<input name="title" maxlength="120" placeholder="给这支视频起个名字"></label><label>视频简介 <span class="optional">选填</span><textarea name="description" rows="3" maxlength="500" placeholder="简单介绍一下视频内容..."></textarea></label></div><button class="button button-primary submit-button" type="submit">上传并发布 <span>↗</span></button><div class="form-status" id="videoStatus" aria-live="polite"></div></form></section>
<section class="admin-panel hidden" id="panel-document"><div class="panel-heading"><div><h2>收进一份新文档</h2><p>支持 PDF、Word、Excel、PPT、TXT、CSV 等常见格式。</p></div><span class="panel-sticker">📁</span></div><form class="upload-form" id="documentForm" enctype="multipart/form-data"><label class="drop-zone blue-zone" for="documentFile"><input id="documentFile" name="file" type="file" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.txt,.rtf,.csv,.md" required><span class="upload-symbol">↑</span><b>点击选择文档，或拖拽到这里</b><small id="documentFileName">PDF / DOCX / XLSX / PPTX / TXT 等</small></label><div class="form-fields"><label>文档标题<input name="title" maxlength="120" placeholder="给这份文档起个名字"></label><label>文档说明 <span class="optional">选填</span><textarea name="description" rows="3" maxlength="500" placeholder="简单说明文档用途..."></textarea></label></div><button class="button button-primary submit-button" type="submit">上传并发布 <span>↗</span></button><div class="form-status" id="documentStatus" aria-live="polite"></div></form></section>
<section class="admin-panel hidden" id="panel-manage"><div class="panel-heading"><div><h2>已经收藏的资源</h2><p>管理前台展示的全部视频和文档。</p></div><span class="panel-sticker">🧺</span></div><div id="manageList" class="manage-list"><div class="loading-state">正在整理资源...</div></div></section>
<div class="admin-footnote">🐾 上传成功后，资源会自动同步到前台。请保持服务器运行，并为 uploads 与 data 目录配置持久化存储。</div></main><div class="toast" id="toast"></div><script src="/admin.js"></script></body></html>
